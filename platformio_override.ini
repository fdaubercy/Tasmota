; ***  Example PlatformIO Project Configuration Override File   ***
; ***  Changes done here override settings in platformio.ini    ***
;
; *****************************************************************
; ***  to activate rename this file to platformio_override.ini  ***
; *****************************************************************
;
; Please visit documentation for the options and examples
; http://docs.platformio.org/en/stable/projectconf.html

[platformio]
; For best Gitpod performance remove the ";" in the next line. Needed Platformio files are cached and installed at first run
;core_dir = .platformio
; For unrelated compile errors with Windows it can help to shorten Platformio project path
;workspace_dir = c:\.pio
data_dir = data/etage2/tasmota32s3-grenier
;extra_configs           = platformio_tasmota_user_env.ini

; *** Build/upload environment
default_envs            =
; *** Uncomment the line(s) below to select version(s)
; *** Versions Safeboot
                            ; tasmota32-safeboot       
                            ; tasmota32s3-safeboot  
                            ; tasmota32p4-safeboot
                            ; tasmota32p4r3-safeboot

; *** Versions de Tasmota pour ESP32
                            ; tasmota32-base
                            ; tasmota32-cave-serveur-rly
                            ; tasmota32-rdc-vr-porte
                            ; tasmota32-bureau-interrupteur-differentiel

; *** Versions de Tasmota pour ESP32S3
                            ; tasmota32s3-base-N16R8
                            ; tasmota32s3-garage-serveur-modbus
                            tasmota32s3-garage-capteurs-cuve-modbus
                            tasmota32s3-garage-rideau-garage-modbus
                            ; tasmota32s3-etage2-grenier
	
; *** Versions de Tasmota pour ESP32P4                        
                            ; tasmota32p4-base-wifi6
                            ; tasmota32p4-base-devkit
                            tasmota32p4-garage-serveur-modbus

[tasmota]
; *** Global build / unbuild compile time flags for ALL Tasmota / Tasmota32 [env]
;build_unflags           =
;build_flags             = 

[env]
;build_unflags           = ${common.build_unflags}
;                          -Wswitch-unreachable
;build_flags             = ${common.build_flags}
;                          -DF_CRYSTAL=26000000
;                          -Wno-switch-unreachable
; *** Optional Debug messages
;                         -DDEBUG_TASMOTA_CORE
;                         -DDEBUG_TASMOTA_DRIVER
;                         -DDEBUG_TASMOTA_SENSOR
; Build variant 1MB = 1MB firmware no filesystem (default)
;board                   = ${common.board}
; Build variant 2MB = 1MB firmware, 1MB filesystem (most Shelly devices)
;board                   = esp8266_2M1M
; Build variant 4MB = 1MB firmware, 1MB OTA, 2MB filesystem (WEMOS D1 Mini, NodeMCU, Sonoff POW)
;board                   = esp8266_4M2M
;board_build.f_cpu       = 160000000L
;board_build.f_flash     = 40000000L
; *** Define serial port used for erasing/flashing/terminal
;upload_port             = COM4
;monitor_port            = COM4
lib_extra_dirs          = ${library.lib_extra_dirs}


[env:tasmota32_base]
; *** Uncomment next lines ";" to enable development Tasmota Arduino version ESP32
;platform                = https://github.com/Jason2866/platform-espressif32.git#Arduino/IDF55

;platform_packages       = framework-arduinoespressif32 @ 
;build_unflags           = ${esp32_defaults.build_unflags}
;build_flags             = ${esp32_defaults.build_flags}
;board                   = esp32
;board_build.f_cpu       = 240000000L
;board_build.f_flash     = 40000000L
;board_build.flash_mode  = qio
;board_build.flash_size  = 8MB
;board_upload.maximum_size = 8388608
;board_upload.arduino.flash_extra_images =
;board_build.partitions  = partitions/esp32_partition_app2944k_fs2M.csv
; *** Serial port used for erasing/flashing the ESP32
;upload_port             = COM4
;monitor_port            = COM4
;upload_speed            = 115200
monitor_speed           = 115200
;upload_resetmethod      = ${common.upload_resetmethod}
lib_extra_dirs           = ${library.lib_extra_dirs}
; *** ESP32 lib. ALWAYS needed for ESP32 !!!
                          lib/libesp32
; *** comment the following line if you dont use LVGL in a Tasmota32 build. Reduces compile time
                          lib/libesp32_lvgl
; *** uncomment the following line if you use Bluetooth or Apple Homekit in a Tasmota32 build. Reduces compile time
                          lib/libesp32_div
; *** uncomment the following line if you use Epaper driver epidy in your Tasmota32 build. Reduces compile time
;                          lib/libesp32_eink

; Ajoute les fonctionnalités et paramétrages personnalisées de platformio
extra_scripts           =   
                            pre:outils_docs/scripts_python/pre_utilitaires_platformio.py
                            ${esp32_defaults.extra_scripts}

[env:tasmota32_idf55_base]
; Override settings for esp32c5, esp32c6 and esp32p4. ONLY IDF 55 based is possible here!!
; *** Uncomment next lines ";" to enable development Tasmota Arduino IDF 55 based platform.
;platform                = https://github.com/Jason2866/platform-espressif32.git#Arduino/IDF55_gcc152

; Force le framework IDF55 dans un répertoire haché séparé pour éviter le conflit avec le
; framework ESP32-S3 (v3.1.11). Sans ce pin, les deux platforms partagent le même dossier
; framework-arduinoespressif32/ et la dernière compilation écrase l'autre.
;platform_packages       = framework-arduinoespressif32 @ https://github.com/tasmota/arduino-esp32/releases/download/v3.3.8/framework-arduinoespressif32.tar.xz

monitor_speed           = 115200
;upload_resetmethod      = ${common.upload_resetmethod}
lib_extra_dirs           = ${library.lib_extra_dirs}
; *** ESP32 lib. ALWAYS needed for ESP32 !!!
                          lib/libesp32
; *** comment the following line if you dont use LVGL in a Tasmota32 build. Reduces compile time
                          lib/libesp32_lvgl
; *** uncomment the following line if you use Bluetooth or Apple Homekit in a Tasmota32 build. Reduces compile time
                          lib/libesp32_div
; *** uncomment the following line if you use Epaper driver epidy in your Tasmota32 build. Reduces compile time
;                          lib/libesp32_eink
; Ajoute les fonctionnalités et paramétrages personnalisées de platformio
extra_scripts           =   
                            pre:outils_docs/scripts_python/pre_utilitaires_platformio.py
                            ${esp32_defaults.extra_scripts}

[library]
shared_libdeps_dir      = lib
; *** Library disable / enable for variant Tasmota(32). Disable reduces compile time
; *** !!! Disabling needed libs will generate compile errors !!!
; *** The resulting firmware will NOT be different if you leave all libs enabled
; *** Disabling by putting a ";" in front of the lib name
; *** If you dont know what it is all about, do not change
lib_extra_dirs           =
; *** Only disabled for Tasmota minimal and Tasmota light. For all other variants needed!
                           lib/lib_basic
; **** I2C devices. Most sensors. Disable only if you dont have ANY I2C device enabled
                           lib/lib_i2c
; *** Displays. Disable if you dont have any Display activated
                           lib/lib_display
; *** Bear SSL and base64. Disable if you dont have SSL or TLS activated
                           lib/lib_ssl
; *** Audio needs a lot of time to compile. Mostly not used functions. Recommended to disable
                           lib/lib_audio
; *** RF 433 stuff (not RF Bridge). Recommended to disable
                           lib/lib_rf
; *** Mostly not used functions. Recommended to disable
                           lib/lib_div


