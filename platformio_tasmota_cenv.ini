;----------------------------------------------------------------------------------------------------------------------------------------------------
; LOCALISATION: GARAGE
;----------------------------------------------------------------------------------------------------------------------------------------------------
; Modules Tasmota de gestion du garage et de cuve et de T° d'eau de cuve
; 1 Module maitre 'tasmota32p4-garage-serveur-modbus' qui gère le principale et communique par RS485
;        avec les modules esclaves
;        Le module maitre gère le RangExtender
;        Le module esclave se connecte dessus
; 1 Module esclave 'tasmota32s3-garage-capteurs-cuve-modbus' qui récupère les infos de la cuve
; 1 Module esclave 'tasmota32s3-garage-rideau-garage-modbus' qui gère le rideau du garage
;----------------------------------------------------------------------------------------------------------------------------------------------------
[env:tasmota32p4-garage-serveur-modbus]
; Upload OTA : l'IP est lue automatiquement depuis tasmota/user_config_override.h (WIFI_IP_ADDRESS)
; Pour revenir en mode série, commenter extra_scripts, décommenter upload_port et monitor_port :
upload_port             = COM34
monitor_port            = COM34

; Hérite de tous les scripts de tasmota32_base (dont post_esp32.py pour le LittleFS),
; puis ajoute ota-files-uploader.py qui :
;   1. Configure UPLOAD_PORT depuis WIFI_IP_ADDRESS (→ 192.168.0.43:80/u2?fsz=)
;   2. Reconfigure UPLOADCMD pour HTTP après post_esp32.py (via AddPostAction en dernier)
;   3. Téléverse les fichiers Berry via /ufsd après redémarrage du module
; extra_scripts           = ${env:tasmota32_base.extra_scripts}
;                           post:outils_docs/scripts_python/ota-files-uploader.py

extends                 = env:tasmota32p4-base-devkit
build_unflags           = ${env:tasmota32p4-base-devkit.build_unflags}
build_flags             = ${env:tasmota32p4-base-devkit.build_flags}
                           -D FIRMWARE_ESP32P4_GARAGE_SERVEUR_MODBUS            ; Firmware perso
                           ;-D UPDATE_IDF55_PLATFORM                            ; Activation de la verification de la version de platform à utiliser

lib_ignore              = ${env:tasmota32p4-base-devkit.lib_ignore}
custom_files_upload     = ${env:tasmota32p4-base-devkit.custom_files_upload}
                           data/garage/tasmota32p4-serveur-modbus              ; scripts tasmota Berry specifiques au module

[env:tasmota32s3-garage-serveur-modbus]
; Upload du firmware par port série
; upload_port             = COM10
; monitor_port            = COM10
extends                 = env:tasmota32s3-base-N16R8  
build_flags             = ${env:tasmota32s3-base-N16R8.build_flags}
; Firmware perso
                           -D FIRMWARE_ESP32S3_GARAGE_SERVEUR_MODBUS

custom_files_upload     =   ${env:tasmota32s3-base-N16R8.custom_files_upload}
                            data/garage/tasmota32s3-serveur-modbus              ; scripts tasmota Berry specifiques au module

[env:tasmota32s3-garage-capteurs-cuve-modbus]
; *** Upload du firmware par serveur OTA avec SCP
; *** Upload du firmware par port série
upload_port             = COM11
monitor_port            = COM11

extends                 = env:tasmota32s3-base-N16R8
build_flags             = ${env:tasmota32s3-base-N16R8.build_flags}
; Firmware perso
                           -D FIRMWARE_ESP32S3_CAPTEURS_CUVE_MODBUS

custom_files_upload     =   ${env:tasmota32s3-base-N16R8.custom_files_upload}
                            data/garage/tasmota32s3-capteurs-cuve-modbus              ; scripts tasmota Berry specifiques au module

[env:tasmota32s3-garage-rideau-garage-modbus]
; *** Upload du firmware par serveur OTA avec SCP
; *** Upload du firmware par port série
upload_port             = COM13
monitor_port            = COM13

extends                 = env:tasmota32s3-base-N16R8
build_flags             = ${env:tasmota32s3-base-N16R8.build_flags}
; Firmware perso
                           -D FIRMWARE_ESP32S3_RIDEAU_GARAGE_MODBUS

custom_files_upload     =   ${env:tasmota32s3-base-N16R8.custom_files_upload}
                            data/garage/tasmota32s3-rideau-garage-modbus              ; scripts tasmota Berry specifiques au module

