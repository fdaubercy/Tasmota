; *********************************************************************
; Cette section montre comment créer 2 binaires alternatifs : tasmota-*.bin
; Ces binaires sont dérivés de tasmota.bin et
; la personnalisation est définie dans user_config_override.h
; Ces binaires sont pour ESP8266
; Le nom après la balise env: donnera son nom au binaire
;[env:tasmota-serveur-rly-cave]
;build_flags = ${env.build_flags} -DFIRMWARE_SERVEUR_RLY_CAVE
; *********************************************************************
; Exemple similaire pour ESP32
; Notez que vous devez indiquer explicitement qu'ils dérivent de `tasmota32`

; *********************************************************************
; POUR CREATION DE FICHIER TAPP
; Instller 'pip install tappack' si non-fait dans Platformio (terminal)
; Créer le fichier avec la commande suivante :
; tappack --module-path 'chemin relatif du dossier'\ --output 'chemin relatif du fichier output.tapp'
; *********************************************************************

; *********************************************************************
; Ce paramètre sera configurer pendant la compilation par le script
; 'pio-tools/custom_target.py' pour chaque environnement de construction
; Il permet de définir le dossier 'data' à utiliser pour chaque firmware
; *********************************************************************

;------------------------------------------------------------------------------------------------
; Modèles d'ESP32 de base personnalisés en fonction de :
; - la taille de la mémoire flash,
; - la taille de la mémoire RAM,
; - la présence de la PSRAM
; - la présence de l'écran
;------------------------------------------------------------------------------------------------
[tasmota32-base]
; Reset global build / unbuild compile time flags for ALL Tasmota / Tasmota32 [env]
; since custom env are designed to enable options individual
build_flags             = ${env:tasmota32_base.build_flags}
                           -D FIRMWARE_TASMOTA32
                           -D MY_LANGUAGE=fr_FR 
                           -D OTA_URL='"http://ota.tasmota.com/tasmota32/release/tasmota32-FR.bin"'

build_unflags           = ${env:tasmota32_base.build_unflags}
lib_ignore              = ${env:tasmota32_base.lib_ignore}

; *** Serial port used for erasing/flashing the ESP32
upload_speed            = 921600
monitor_speed           = 115200

custom_files_upload     =   ${env:tasmota32_base.custom_files_upload}

; *********************************************************************************************
; Modèles d'ESP32 S3 de basepersonnalisés en fonction de :
; - la taille de la mémoire flash,
; - la taille de la mémoire RAM,
; - la présence de la PSRAM
; - la présence de l'écran
; *********************************************************************************************
[env:tasmota32s3-base-N16R8]
extends                 = env:tasmota32s3  
board                   = esp32s3-qio_opi
board_build.f_cpu       = 240000000L
board_build.f_flash     = 80000000L

upload_port             = COM11
monitor_port            = COM11

build_flags             = ${env:tasmota32s3.build_flags}
                            -D FIRMWARE_TASMOTA32
                            -D MY_LANGUAGE=fr_FR 
; Fonctionnalités LVGL
                            -D FIRMWARE_LVGL
                            -D USE_LVGL_OPENHASP
                            -D USE_BERRY_ULP
                            ; -D USE_WEBCAM

                            -D OTA_URL='"http://ota.tasmota.com/tasmota32/release/tasmota32s3.bin"'

lib_ignore              = ${env:tasmota32s3.lib_ignore}
custom_files_upload     = ${env:tasmota32s3.custom_files_upload}
; scripts tasmota Berry en option
                            tasmota/berry/leds_panel/leds_panel.bec
                            tasmota/berry/modules/Partition_Wizard/partition_wizard.bec

; ESP32S3 N16R8 (Taille FileSysteme = 10Mo)
; Site de calcul de partition: https://thelastoutpostworkshop.github.io/microcontroller_devkit/esp32partitionbuilder/
board_name                      = ESP32-S3 16MB Flash / 8MB OPI PSRAM, Tasmota 3.9MB Code/OTA / 11.8MB FileSystem
board_build.partitions          = partitions/esp32_partition_app3997k_fs11862k.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_upload.maximum_ram_size   = 327680

; *********************************************************************************************
; Modèles d'ESP32 P4 personnalisés en fonction de :
; - la taille de la mémoire flash,
; - la taille de la mémoire RAM,
; - la présence de la PSRAM
; - la présence de l'écran
; - la 'platform' utilisée
;    * la platform qui utilise la version minimum d'ESP-IDF v5.3
;    * l'ESP32-P4 supporte minimum: ESP-IDF v5.3 (cf. 'https://github.com/tasmota/esp-idf')
; *********************************************************************************************
[env:tasmota32p4-base-wifi6]
; *** Upload du firmware par port série
upload_port             = COM34
monitor_port            = COM34
; upload_port             = /dev/ttyACM0
; monitor_port            = /dev/ttyACM0
; *** Upload du firmware par serveur OTA avec SCP
; upload_port             = 192.168.4.1:80/u2?fsz

extends                 = env:tasmota32p4
build_unflags           = ${env:tasmota32p4.build_unflags}
build_flags             = ${env:tasmota32p4.build_flags}
                           -D MY_LANGUAGE=fr_FR 
                           -D ESP32P4_BASE_WIFI6

lib_extra_dirs          = ${env:tasmota32p4.lib_extra_dirs}
                            lib/lib_audio
                            lib/libesp32_audio

lib_ignore              = ${env:tasmota32p4.lib_ignore}
custom_files_upload     = ${env:tasmota32p4.custom_files_upload}
; scripts tasmota Berry en option
                           tasmota/berry/leds_panel/leds_panel.bec
                           tasmota/berry/modules/Partition_Wizard/partition_wizard.bec

[env:tasmota32p4-base-devkit]
; *** Upload du firmware par port série
upload_port             = COM34
monitor_port            = COM34
; upload_port             = /dev/ttyACM0
; monitor_port            = /dev/ttyACM0
; *** Upload du firmware par serveur OTA avec SCP
; upload_port             = 192.168.4.1:80/u2?fsz

extends                 = env:tasmota32p4
build_unflags           = ${env:tasmota32p4.build_unflags}
build_flags             = ${env:tasmota32p4.build_flags}
                           -D MY_LANGUAGE=fr_FR 
                           -D ESP32P4_BASE_DEVKIT

lib_extra_dirs          = ${env:tasmota32p4.lib_extra_dirs}
                            lib/lib_audio
                            lib/libesp32_audio

lib_ignore              = ${env:tasmota32p4.lib_ignore}
custom_files_upload     = ${env:tasmota32p4.custom_files_upload}
; scripts tasmota Berry en option
                           tasmota/berry/leds_panel/leds_panel.bec
                           tasmota/berry/modules/Partition_Wizard/partition_wizard.bec

[env:tasmota32p4r3-base-devkit]
; *** Upload du firmware par port série
upload_port             = COM34
monitor_port            = COM34
; upload_port             = /dev/ttyACM0
; monitor_port            = /dev/ttyACM0
; *** Upload du firmware par serveur OTA avec SCP
; upload_port             = 192.168.4.1:80/u2?fsz

extends                 = env:tasmota32p4r3
build_unflags           = ${env:tasmota32p4r3.build_unflags}
build_flags             = ${env:tasmota32p4r3.build_flags}
                           -D MY_LANGUAGE=fr_FR 
                           -D ESP32P4_BASE_DEVKIT

lib_extra_dirs          = ${env:tasmota32p4r3.lib_extra_dirs}
                            lib/lib_audio
                            lib/libesp32_audio

lib_ignore              = ${env:tasmota32p4r3.lib_ignore}
custom_files_upload     = ${env:tasmota32p4r3.custom_files_upload}
; scripts tasmota Berry en option
                           tasmota/berry/leds_panel/leds_panel.bec
                           tasmota/berry/modules/Partition_Wizard/partition_wizard.bec

;----------------------------------------------------------------------------------------------------------------------------------------------------
; LOCALISATION: JARDIN
;----------------------------------------------------------------------------------------------------------------------------------------------------
; 1 Module 'tasmota-pompe-piscine': Sonoff S2X qui gère la pompe de piscine
;----------------------------------------------------------------------------------------------------------------------------------------------------
[env:tasmota-pompe-piscine]
extends                 =   env:tasmota
build_flags             =   ${env:tasmota.build_flags} 
                            -D FIRMWARE_ESP8266_POMPE_PISCINE

;----------------------------------------------------------------------------------------------------------------------------------------------------
; LOCALISATION: CAVE
;----------------------------------------------------------------------------------------------------------------------------------------------------
; 1 Module 'tasmota32-cave-serveur-rly': serveur relais RDC / T° cave / Gestion de la pompe de cave
;----------------------------------------------------------------------------------------------------------------------------------------------------
[env:tasmota32-cave-serveur-rly]
extends                 =   env:tasmota32-base
build_flags             =   ${env:tasmota32-base.build_flags} 
                           -D FIRMWARE_ESP32_CAVE_SERVEUR_RLY

;                           Activation de la PSRAM
                           -D HAS_PSRAM_FIX
                           -D BOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue

; example for custom file upload in Tasmota Filesystem
custom_files_upload     =   ${env:tasmota32-base.custom_files_upload}
                           data/SERVEUR_RLY_RDC/FlashFS/_persist.json
                           data/SERVEUR_RLY_RDC/FlashFS/autoexec.be
                           data/SERVEUR_RLY_RDC/FlashFS/commandes.be
                           data/SERVEUR_RLY_RDC/FlashFS/controleGlobal.be
                           data/SERVEUR_RLY_RDC/FlashFS/gestionFileFolder.be
                           data/SERVEUR_RLY_RDC/FlashFS/gestionWeb.be
                           data/SERVEUR_RLY_RDC/FlashFS/globalFonctions.be
                           data/SERVEUR_RLY_RDC/FlashFS/webFonctions.be
                           data/SERVEUR_RLY_RDC/SDCard/css/SD_main.css
                           data/SERVEUR_RLY_RDC/SDCard/html/SD_formSelectParametres.html
                           data/SERVEUR_RLY_RDC/SDCard/html/SD_pageModifCapteurs.html
                           data/SERVEUR_RLY_RDC/SDCard/html/SD_pageParamDiverses.html
                           data/SERVEUR_RLY_RDC/SDCard/html/SD_pageParamServeur.html
                           data/SERVEUR_RLY_RDC/SDCard/html/SD_pageParam.html
                           data/SERVEUR_RLY_RDC/SDCard/js/SD_jsModifCapteurs.js
                           data/SERVEUR_RLY_RDC/SDCard/js/SD_jsParamDiverses.js
                           data/SERVEUR_RLY_RDC/SDCard/js/SD_jsParamServeur.js
                           data/SERVEUR_RLY_RDC/SDCard/js/SD_jsParam.js
                           data/SERVEUR_RLY_RDC/SDCard/js/SD_main.js

;----------------------------------------------------------------------------------------------------------------------------------------------------
; LOCALISATION: RDC
;----------------------------------------------------------------------------------------------------------------------------------------------------
; 1 Module 'tasmota32-rdc-vr-porte': interrupteur différentiel qui gère les prise de bureau
;----------------------------------------------------------------------------------------------------------------------------------------------------
[env:tasmota32-rdc-vr-porte]
extends                 =   env:tasmota32-base
build_flags             =   ${env:tasmota32-base.build_flags} 
                           -D FIRMWARE_ESP32_VR_PORTE 

;----------------------------------------------------------------------------------------------------------------------------------------------------
; LOCALISATION: BUREAU 1er ETAGe
;----------------------------------------------------------------------------------------------------------------------------------------------------
; 1 Module 'tasmota32-bureau-interrupteur-differentiel': interrupteur différentiel qui gère les prise de bureau
;----------------------------------------------------------------------------------------------------------------------------------------------------
[env:tasmota32-bureau-interrupteur-differentiel]
; *** Upload du firmware par serveur OTA avec SCP
; *** Upload du firmware par port série
upload_port             = COM34
monitor_port            = COM34

extends                 = env:tasmota32-base
build_flags             = ${env:tasmota32-base.build_flags} 
; Firmware perso
                           -D FIRMWARE_ESP32_BUREAU_DISJONCTEUR_DIFFERENTIEL

custom_files_upload     =   ${env:tasmota32-base.custom_files_upload}
                            data/bureau/tasmota32-interrupteur-differentiel/              ; scripts tasmota Berry specifiques au module

;----------------------------------------------------------------------------------------------------------------------------------------------------
; LOCALISATION: 2EME ETAGE
;----------------------------------------------------------------------------------------------------------------------------------------------------
; 1 Module 'tasmota32s3-etage2-grenier': Gestionnaire de Trappe de grenier
;----------------------------------------------------------------------------------------------------------------------------------------------------
[env:tasmota32s3-etage2-grenier]
; *** Upload du firmware par serveur OTA avec SCP
