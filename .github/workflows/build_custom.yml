name: Build_custom

on:
  workflow_dispatch:           # déclenchement manuel depuis GitHub Actions
  schedule:
    - cron: '0 2 * * *'       # tous les soirs à 2h UTC

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --- Choix des envs : cenv moins outils_docs/compilations_nuit/envs_github.json (page « Taches planifiees ») ---
  choix:
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.m.outputs.matrice }}
      nombre: ${{ steps.m.outputs.nombre }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: m
        name: Calculer la matrice
        run: python outils_docs/scripts_python/maintenance/matrice_github.py

  # --- Environnements Tasmota de base (ESP32 S3 / P4) ---
  base-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false         # tente tous les variants même si l'un échoue
      matrix:
        variant:
          - tasmota32
          - tasmota32s3
          - tasmota32p4
          - tasmota32p4r3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false
      - name: Install dependencies
        run: |
          uv pip install --system pioarduino
          cp ./platformio_override_sample.ini ./platformio_override.ini
      - name: Run PlatformIO
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: platformio run -e ${{ matrix.variant }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.variant }}
          path: ./build_output
          retention-days: 30

  # --- Environnements personnalisés (platformio_tasmota_cenv.ini) ---
  custom-images:
    needs: choix
    if: needs.choix.outputs.nombre != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false         # tente tous les variants même si l'un échoue
      matrix:
        variant: ${{ fromJSON(needs.choix.outputs.matrice) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false
      - name: Install dependencies
        run: |
          uv pip install --system pioarduino
          cp ./platformio_override_sample.ini ./platformio_override.ini
      - name: Run PlatformIO
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: platformio run -e ${{ matrix.variant }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.variant }}
          path: ./build_output
          retention-days: 30
