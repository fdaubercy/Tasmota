name: Build_custom

on:
  workflow_dispatch:           # déclenchement manuel depuis GitHub Actions
  schedule:
    - cron: '0 2 * * *'       # tous les soirs à 2h UTC

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --- Controle : tous les envs du cenv sont dans la matrice (la liste ecrite a la main avait pris du retard) ---
  verifie-matrice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Comparer le cenv et la matrice custom-images
        run: |
          python - <<'EOF'
          import re, sys
          cenv = set(re.findall(r'^\[env:([^\]]+)\]', open('platformio_tasmota_cenv.ini', encoding='utf-8').read(), re.M))
          wf = open('.github/workflows/build_custom.yml', encoding='utf-8').read()
          bloc = re.search(r'^  custom-images:.*?steps:', wf, re.M | re.S).group(0)
          matrice = set(re.findall(r'^\s+- (\S+)\s*$', bloc, re.M)) - {'ubuntu-latest'}
          manque, en_trop = sorted(cenv - matrice), sorted(matrice - cenv)
          print('envs du cenv :', len(cenv), '- matrice :', len(matrice))
          if manque or en_trop:
              print('MANQUENT dans la matrice :', manque)
              print('INCONNUS du cenv :', en_trop)
              sys.exit(1)
          EOF

  # --- Environnements Tasmota de base (ESP32 S3 / P4) ---
  base-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false         # tente tous les variants même si l'un échoue
      matrix:
        variant:
          - tasmota32
          - tasmota32s3
          - tasmota32p4
          - tasmota32p4r3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false
      - name: Install dependencies
        run: |
          uv pip install --system pioarduino
          cp ./platformio_override_sample.ini ./platformio_override.ini
      - name: Run PlatformIO
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: platformio run -e ${{ matrix.variant }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.variant }}
          path: ./build_output
          retention-days: 30

  # --- Environnements personnalisés (platformio_tasmota_cenv.ini) ---
  custom-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false         # tente tous les variants même si l'un échoue
      matrix:
        variant:
          - tasmota32s3-base-N16R8
          - tasmota32p4-base-wifi6
          - tasmota32p4-base-devkit
          - tasmota32p4r3-base-devkit
          - tasmota32-cave-serveur-rly
          - tasmota32-rdc-vr-porte
          - tasmota32-bureau-interrupteur-energie
          - tasmota32s3-etage2-grenier
          - tasmota32p4-garage-serveur-modbus
          - tasmota32s3-garage-serveur-modbus
          - tasmota32s3-garage-capteurs-cuve-modbus
          - tasmota32s3-garage-rideau-garage-modbus
          - tasmota32s3-garage-portail-jardin-modbus
          - tasmota32-base
          - tasmota32s3-base-N16R8-sans-ecran
          - tasmota32-jardin-projecteur-led
          - tasmota32s3-cave-serveur-rly
          - tasmota32s3-cave-ecran
          - tasmota32s3-rdc-grenier
          - tasmota32s3-bureau-serveur-debits-pac
          - tasmota32s3-bureau-ecran-debits-pac
          - tasmota-base-1M
          - tasmota-jardin-pompe-piscine
          - tasmota-cave-lumiere-porte
          - tasmota-rdc-tv-salon
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false
      - name: Install dependencies
        run: |
          uv pip install --system pioarduino
          cp ./platformio_override_sample.ini ./platformio_override.ini
      - name: Run PlatformIO
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: platformio run -e ${{ matrix.variant }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.variant }}
          path: ./build_output
          retention-days: 30
