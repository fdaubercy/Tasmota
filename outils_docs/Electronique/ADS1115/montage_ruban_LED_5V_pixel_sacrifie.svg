<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" font-family="Segoe UI, Arial, sans-serif" font-size="14">
<defs><g id="gnd" stroke="#222" stroke-width="2"><line x1="0" y1="0" x2="0" y2="12"/><line x1="-14" y1="12" x2="14" y2="12"/><line x1="-9" y1="18" x2="9" y2="18"/><line x1="-4" y1="24" x2="4" y2="24"/></g></defs>
<rect width="1500" height="960" fill="#ffffff"/>
<text x="30" y="42" font-size="24" font-weight="bold" fill="#111">Ruban WS2812B 5 V — variante sans 74AHCT125 : la LED sacrifiée</text>
<text x="30" y="66" fill="#555">Un pixel découpé du ruban, alimenté à 4,3 V par une diode, sert de convertisseur de niveau entre le GPIO6 (3,3 V) et le ruban (5 V)</text>

<!-- Cadre du schéma -->
<rect x="30" y="90" width="980" height="840" rx="10" fill="#fafafa" stroke="#bbb"/>

<!-- Alimentation -->
<rect x="50" y="115" width="180" height="110" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="125" y="148" text-anchor="middle" font-weight="bold">Alimentation 5 V</text>
<text x="125" y="170" text-anchor="middle" font-size="13">10 A (8 A mini)</text>
<text x="222" y="155" text-anchor="end" font-size="12" fill="#c62828">+5V</text>
<text x="222" y="205" text-anchor="end" font-size="12">GND</text>

<!-- Rail +5V -->
<line x1="230" y1="150" x2="245" y2="150" stroke="#c62828" stroke-width="4"/>
<rect x="245" y="141" width="60" height="18" rx="3" fill="#fff" stroke="#c62828" stroke-width="2"/>
<text x="275" y="135" text-anchor="middle" font-size="12">fusible 10 A</text>
<line x1="305" y1="150" x2="840" y2="150" stroke="#c62828" stroke-width="4"/>
<line x1="840" y1="150" x2="840" y2="370" stroke="#c62828" stroke-width="4"/>
<line x1="840" y1="370" x2="860" y2="370" stroke="#c62828" stroke-width="4"/>
<text x="700" y="140" text-anchor="middle" fill="#c62828" font-size="13">+5 V puissance (1,5 mm²)</text>

<!-- Retour GND puissance -->
<line x1="230" y1="200" x2="260" y2="200" stroke="#222" stroke-width="4"/>
<line x1="260" y1="200" x2="260" y2="660" stroke="#222" stroke-width="4"/>
<line x1="260" y1="660" x2="840" y2="660" stroke="#222" stroke-width="4"/>
<line x1="840" y1="660" x2="840" y2="550" stroke="#222" stroke-width="4"/>
<line x1="840" y1="550" x2="860" y2="550" stroke="#222" stroke-width="4"/>
<text x="550" y="680" text-anchor="middle" font-size="13">GND puissance — toutes les masses ⏚ (ESP32, LED sacrifiée, ruban) sont reliées à ce fil</text>

<!-- Condensateur réservoir -->
<line x1="780" y1="150" x2="780" y2="222" stroke="#c62828" stroke-width="2"/>
<line x1="764" y1="222" x2="796" y2="222" stroke="#222" stroke-width="3"/>
<line x1="764" y1="232" x2="796" y2="232" stroke="#222" stroke-width="3"/>
<line x1="780" y1="232" x2="780" y2="248" stroke="#222" stroke-width="2"/>
<use href="#gnd" x="780" y="248"/>
<text x="770" y="200" text-anchor="end" font-size="12">1000 µF</text>
<text x="770" y="215" text-anchor="end" font-size="12">≥ 10 V</text>
<text x="760" y="265" text-anchor="end" font-size="11" fill="#555">au plus près</text>
<text x="760" y="279" text-anchor="end" font-size="11" fill="#555">du ruban</text>

<!-- ESP32-S3 -->
<line x1="340" y1="150" x2="340" y2="330" stroke="#c62828" stroke-width="2"/>
<rect x="290" y="330" width="150" height="230" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="365" y="420" text-anchor="middle" font-weight="bold">ESP32-S3</text>
<text x="365" y="440" text-anchor="middle" font-size="12" fill="#555">capteurs cuve</text>
<text x="340" y="350" text-anchor="middle" font-size="12">5V</text>
<text x="432" y="465" text-anchor="end">GPIO6</text>
<text x="340" y="552" text-anchor="middle" font-size="12">GND</text>
<line x1="340" y1="560" x2="340" y2="576" stroke="#222" stroke-width="2"/>
<use href="#gnd" x="340" y="576"/>
<text x="365" y="500" text-anchor="middle" font-size="11" fill="#555">sortie 3,3 V</text>

<!-- Diode -->
<line x1="610" y1="150" x2="610" y2="222" stroke="#c62828" stroke-width="2"/>
<polygon points="596,222 624,222 610,246" fill="#fff" stroke="#222" stroke-width="2"/>
<line x1="594" y1="247" x2="626" y2="247" stroke="#222" stroke-width="3"/>
<text x="634" y="230" font-size="12" font-weight="bold">1N4001</text>
<text x="634" y="246" font-size="11" fill="#555">(ou 1N4148)</text>
<text x="590" y="230" text-anchor="end" font-size="11" fill="#555">anode</text>
<text x="590" y="252" text-anchor="end" font-size="11" fill="#555">cathode (bague)</text>
<line x1="610" y1="247" x2="610" y2="380" stroke="#e65100" stroke-width="2.5"/>
<text x="620" y="320" font-size="13" fill="#e65100" font-weight="bold">≈ 4,3 V</text>
<text x="620" y="336" font-size="11" fill="#e65100">(5 V − 0,7 V)</text>

<!-- LED sacrifiée -->
<rect x="530" y="380" width="160" height="160" rx="6" fill="#ffe0b2" stroke="#e65100" stroke-width="2"/>
<text x="610" y="398" text-anchor="middle" font-size="12">VDD</text>
<text x="538" y="465" font-size="12">DIN</text>
<text x="682" y="465" text-anchor="end" font-size="12">DO</text>
<rect x="596" y="410" width="28" height="28" fill="#ffcc80" stroke="#e65100"/>
<text x="610" y="488" text-anchor="middle" font-weight="bold" font-size="13">LED sacrifiée</text>
<text x="610" y="504" text-anchor="middle" font-size="11" fill="#555">1 pixel WS2812B</text>
<text x="610" y="518" text-anchor="middle" font-size="11" fill="#555">découpé du ruban</text>
<text x="610" y="534" text-anchor="middle" font-size="12">GND</text>
<line x1="610" y1="540" x2="610" y2="556" stroke="#222" stroke-width="2"/>
<use href="#gnd" x="610" y="556"/>

<!-- GPIO6 -> DIN (court) -->
<line x1="440" y1="460" x2="530" y2="460" stroke="#1565c0" stroke-width="2.5"/>
<text x="485" y="450" text-anchor="middle" font-size="11" fill="#1565c0">3,3 V</text>
<text x="485" y="480" text-anchor="middle" font-size="11" fill="#1565c0" font-weight="bold">&lt; 10 cm</text>

<!-- DO -> R -> DIN ruban (peut être long) -->
<line x1="690" y1="460" x2="730" y2="460" stroke="#e65100" stroke-width="2.5"/>
<rect x="730" y="451" width="60" height="18" rx="2" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="760" y="444" text-anchor="middle" font-size="12">330 Ω</text>
<line x1="790" y1="460" x2="860" y2="460" stroke="#e65100" stroke-width="2.5"/>
<text x="760" y="490" text-anchor="middle" font-size="11" fill="#e65100">signal ≈ 4,3 V</text>
<text x="760" y="505" text-anchor="middle" font-size="11" fill="#e65100">fil long possible</text>

<!-- Ruban -->
<rect x="860" y="330" width="135" height="270" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
<text x="868" y="375" font-size="12" fill="#c62828">+5V</text>
<text x="868" y="465" font-size="12" fill="#e65100">DIN</text>
<text x="868" y="555" font-size="12">GND</text>
<text x="950" y="400" text-anchor="middle" font-weight="bold" font-size="13">WS2812B</text>
<text x="950" y="418" text-anchor="middle" font-size="12">131 LED</text>
<rect x="915" y="430" width="22" height="22" fill="#ffcc80" stroke="#f57f17"/>
<rect x="915" y="462" width="22" height="22" fill="#ffcc80" stroke="#f57f17"/>
<rect x="915" y="494" width="22" height="22" fill="#ffcc80" stroke="#f57f17"/>
<text x="926" y="535" text-anchor="middle" font-size="14">⋮</text>
<text x="927" y="585" text-anchor="middle" font-size="11" fill="#555">sens des flèches →</text>
<text x="860" y="625" font-size="11" fill="#c62828">fin du ruban : +5V et GND</text>
<text x="860" y="640" font-size="11" fill="#c62828">réinjectés depuis l'alim</text>

<!-- Pourquoi ça marche -->
<rect x="50" y="705" width="940" height="210" rx="8" fill="#ffffff" stroke="#bbb"/>
<text x="70" y="732" font-size="16" font-weight="bold">Pourquoi ça marche : deux seuils, deux marges</text>
<text x="70" y="760" font-size="13">• Entrée de la LED sacrifiée : VDD = 5,0 − 0,7 = 4,3 V → seuil 0,7 × 4,3 = <tspan font-weight="bold">3,0 V</tspan> &lt; 3,3 V du GPIO6 ✓ (marge 0,3 V)</text>
<text x="70" y="784" font-size="13">• Elle régénère le signal : son DO sort ≈ 4,3 V &gt; <tspan font-weight="bold">3,5 V</tspan> exigés par le ruban sous 5 V ✓ (marge 0,8 V)</text>
<text x="70" y="808" font-size="13">• Alim réglée haut (5,25 V) : pixel à 4,55 V → seuil 3,2 V, encore sous 3,3 V. Au-delà de 5,25 V, le montage ne tient plus.</text>
<text x="70" y="832" font-size="13">• <tspan font-weight="bold">Pas de diode Schottky</tspan> (1N5819…) : chute de 0,3 V → pixel à 4,7 V → seuil 3,3 V : aucun gain.</text>
<text x="70" y="856" font-size="13">• La diode ne porte qu'un pixel (60 mA au plus) : une 1N4148 suffit, la 1N4001 est plus robuste.</text>
<text x="70" y="880" font-size="13">• Comparé au 74AHCT125 : aucune puce à ajouter, mais 0,3 V de marge à l'entrée au lieu de 1,3 V.</text>
<text x="70" y="904" font-size="13" fill="#555">   Fil GPIO6 → DIN très court, et LED sacrifiée collée à l'ESP32, dans son boîtier.</text>

<!-- Panneau de droite -->
<rect x="1030" y="90" width="440" height="840" rx="10" fill="#fafafa" stroke="#bbb"/>
<text x="1050" y="122" font-size="17" font-weight="bold">Mise en œuvre, pas à pas</text>
<text x="1050" y="154" font-size="13" font-weight="bold">1. Découper le pixel</text>
<text x="1050" y="176" font-size="13">Au bout du ruban, sur le trait de coupe (repère</text>
<text x="1050" y="196" font-size="13">ciseaux), en gardant ses 4 plots : +5V, DIN, DO,</text>
<text x="1050" y="216" font-size="13">GND. Respecter le sens des flèches.</text>
<text x="1050" y="248" font-size="13" font-weight="bold">2. La diode</text>
<text x="1050" y="270" font-size="13">Anode côté +5 V de l'alimentation, cathode</text>
<text x="1050" y="290" font-size="13">(côté bague) sur le plot +5V du pixel découpé.</text>
<text x="1050" y="310" font-size="13">Seul ce pixel passe par la diode, jamais le ruban.</text>
<text x="1050" y="342" font-size="13" font-weight="bold">3. Les données</text>
<text x="1050" y="364" font-size="13">GPIO6 → DIN du pixel : fil le plus court possible</text>
<text x="1050" y="384" font-size="13">(&lt; 10 cm, pixel dans le boîtier de l'ESP32).</text>
<text x="1050" y="404" font-size="13">DO du pixel → 330 Ω → DIN du ruban : ce fil-là</text>
<text x="1050" y="424" font-size="13">peut être long, le signal y est déjà à ≈ 4,3 V.</text>
<text x="1050" y="456" font-size="13" font-weight="bold">4. Les masses</text>
<text x="1050" y="478" font-size="13">GND du pixel, de l'ESP32 et du ruban reliés.</text>
<text x="1050" y="510" font-size="13" font-weight="bold">5. Côté Tasmota : un pixel de plus</text>
<text x="1050" y="532" font-size="13">La LED sacrifiée devient le pixel n° 1. Dans le</text>
<text x="1050" y="552" font-size="13">persist : relai1.nbLeds 131 → <tspan font-weight="bold">132</tspan></text>
<text x="1050" y="572" font-size="13">(configModules.be envoie « Pixels nbLeds »).</text>
<text x="1050" y="592" font-size="13">Elle s'allume comme le ruban : elle sert de</text>
<text x="1050" y="612" font-size="13">témoin dans le boîtier (couleur un peu fausse,</text>
<text x="1050" y="632" font-size="13">le bleu manque de tension à 4,3 V : sans effet).</text>
<text x="1050" y="664" font-size="13" font-weight="bold">6. Vérifier</text>
<text x="1050" y="686" font-size="13">• Multimètre sur le plot +5V du pixel : 4,2 à 4,4 V.</text>
<text x="1050" y="706" font-size="13">• Ruban en blanc 100 % quelques minutes, puis</text>
<text x="1050" y="726" font-size="13">   animations : aucun pixel ne doit scintiller.</text>
<text x="1050" y="758" font-size="13" font-weight="bold">Composants</text>
<text x="1050" y="780" font-size="13">1 pixel WS2812B (chute de ruban), 1N4001,</text>
<text x="1050" y="800" font-size="13">330 Ω ¼ W, 1000 µF 10 V, fusible 10 A,</text>
<text x="1050" y="820" font-size="13">alim 5 V 10 A, fil 1,5 mm².</text>
<text x="1050" y="852" font-size="12" fill="#555">Montage de référence (plus de marge) :</text>
<text x="1050" y="870" font-size="12" fill="#555">montage_ruban_LED_5V (74AHCT125).</text>
<text x="1050" y="888" font-size="12" fill="#555">Note : CABLAGE_RUBAN_LED.md, § 3 bis.</text>
</svg>
