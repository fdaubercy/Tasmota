<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" font-family="Segoe UI, Arial, sans-serif" font-size="14">
<defs><g id="gnd" stroke="#222" stroke-width="2"><line x1="0" y1="0" x2="0" y2="12"/><line x1="-14" y1="12" x2="14" y2="12"/><line x1="-9" y1="18" x2="9" y2="18"/><line x1="-4" y1="24" x2="4" y2="24"/></g></defs>
<rect width="1500" height="960" fill="#ffffff"/>
<text x="30" y="42" font-size="24" font-weight="bold" fill="#111">Ruban WS2812B 5 V — câblage sur l'ESP32-S3 de la cuve</text>
<text x="30" y="66" fill="#555">131 LED sur GPIO6 (persist : modules.cuve…relai1, type 1376) · données remontées de 3,3 V à 5 V par un 74AHCT125 · GND commun</text>

<!-- Cadre du schéma -->
<rect x="30" y="90" width="980" height="840" rx="10" fill="#fafafa" stroke="#bbb"/>

<!-- Alimentation -->
<rect x="50" y="115" width="180" height="110" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="125" y="148" text-anchor="middle" font-weight="bold">Alimentation 5 V</text>
<text x="125" y="170" text-anchor="middle" font-size="13">10 A (8 A mini)</text>
<text x="222" y="155" text-anchor="end" font-size="12" fill="#c62828">+5V</text>
<text x="222" y="205" text-anchor="end" font-size="12">GND</text>

<!-- Rail +5V -->
<line x1="230" y1="150" x2="245" y2="150" stroke="#c62828" stroke-width="4"/>
<rect x="245" y="141" width="60" height="18" rx="3" fill="#fff" stroke="#c62828" stroke-width="2"/>
<text x="275" y="135" text-anchor="middle" font-size="12">fusible 10 A</text>
<line x1="305" y1="150" x2="840" y2="150" stroke="#c62828" stroke-width="4"/>
<line x1="840" y1="150" x2="840" y2="370" stroke="#c62828" stroke-width="4"/>
<line x1="840" y1="370" x2="860" y2="370" stroke="#c62828" stroke-width="4"/>
<text x="560" y="140" text-anchor="middle" fill="#c62828" font-size="13">+5 V puissance (1,5 mm² pour 8–10 A)</text>

<!-- Retour GND puissance -->
<line x1="230" y1="200" x2="260" y2="200" stroke="#222" stroke-width="4"/>
<line x1="260" y1="200" x2="260" y2="660" stroke="#222" stroke-width="4"/>
<line x1="260" y1="660" x2="840" y2="660" stroke="#222" stroke-width="4"/>
<line x1="840" y1="660" x2="840" y2="550" stroke="#222" stroke-width="4"/>
<line x1="840" y1="550" x2="860" y2="550" stroke="#222" stroke-width="4"/>
<text x="550" y="680" text-anchor="middle" font-size="13">GND puissance (même section que le +5 V) — toutes les masses ⏚ sont reliées à ce fil</text>

<!-- Condensateur réservoir -->
<line x1="780" y1="150" x2="780" y2="222" stroke="#c62828" stroke-width="2"/>
<line x1="764" y1="222" x2="796" y2="222" stroke="#222" stroke-width="3"/>
<line x1="764" y1="232" x2="796" y2="232" stroke="#222" stroke-width="3"/>
<line x1="780" y1="232" x2="780" y2="248" stroke="#222" stroke-width="2"/>
<use href="#gnd" x="780" y="248"/>
<text x="770" y="200" text-anchor="end" font-size="12">1000 µF</text>
<text x="770" y="215" text-anchor="end" font-size="12">≥ 10 V</text>
<text x="760" y="265" text-anchor="end" font-size="11" fill="#555">au plus près</text>
<text x="760" y="279" text-anchor="end" font-size="11" fill="#555">du ruban</text>

<!-- ESP32-S3 -->
<line x1="360" y1="150" x2="360" y2="330" stroke="#c62828" stroke-width="2"/>
<rect x="300" y="330" width="170" height="230" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="385" y="420" text-anchor="middle" font-weight="bold">ESP32-S3</text>
<text x="385" y="440" text-anchor="middle" font-size="12" fill="#555">capteurs cuve</text>
<text x="360" y="350" text-anchor="middle" font-size="12">5V</text>
<text x="462" y="465" text-anchor="end">GPIO6</text>
<text x="360" y="552" text-anchor="middle" font-size="12">GND</text>
<line x1="360" y1="560" x2="360" y2="576" stroke="#222" stroke-width="2"/>
<use href="#gnd" x="360" y="576"/>
<text x="385" y="500" text-anchor="middle" font-size="11" fill="#555">sortie 3,3 V</text>

<!-- 74AHCT125 -->
<line x1="610" y1="150" x2="610" y2="380" stroke="#c62828" stroke-width="2"/>
<line x1="610" y1="300" x2="660" y2="300" stroke="#c62828" stroke-width="2"/>
<line x1="660" y1="300" x2="660" y2="318" stroke="#c62828" stroke-width="2"/>
<line x1="648" y1="318" x2="672" y2="318" stroke="#222" stroke-width="2.5"/>
<line x1="648" y1="326" x2="672" y2="326" stroke="#222" stroke-width="2.5"/>
<use href="#gnd" x="660" y="326"/>
<text x="680" y="325" font-size="11">100 nF</text>
<rect x="530" y="380" width="160" height="200" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
<text x="610" y="398" text-anchor="middle" font-size="12">VCC (14) = 5 V</text>
<text x="610" y="505" text-anchor="middle" font-weight="bold">74AHCT125</text>
<text x="610" y="521" text-anchor="middle" font-size="11" fill="#555">(ou 74HCT125,</text>
<text x="610" y="535" text-anchor="middle" font-size="11" fill="#555">SN74AHCT1G125)</text>
<text x="540" y="430" font-size="12">1OE (1) → GND</text>
<text x="540" y="465" font-size="12">1A (2)</text>
<text x="682" y="465" text-anchor="end" font-size="12">1Y (3)</text>
<text x="610" y="572" text-anchor="middle" font-size="12">GND (7)</text>
<line x1="470" y1="460" x2="530" y2="460" stroke="#1565c0" stroke-width="2.5"/>
<line x1="610" y1="580" x2="610" y2="596" stroke="#222" stroke-width="2"/>
<use href="#gnd" x="610" y="596"/>
<text x="537" y="553" font-size="9.5" fill="#555">2A–4A → GND · 2OE–4OE → 5 V</text>

<!-- Résistance série -->
<line x1="690" y1="460" x2="730" y2="460" stroke="#6a1b9a" stroke-width="2.5"/>
<rect x="730" y="451" width="60" height="18" rx="2" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="760" y="444" text-anchor="middle" font-size="12">330 Ω</text>
<line x1="790" y1="460" x2="860" y2="460" stroke="#6a1b9a" stroke-width="2.5"/>
<text x="760" y="490" text-anchor="middle" font-size="11" fill="#555">signal 5 V</text>

<!-- Ruban -->
<rect x="860" y="330" width="135" height="270" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
<text x="868" y="375" font-size="12" fill="#c62828">+5V</text>
<text x="868" y="465" font-size="12" fill="#6a1b9a">DIN</text>
<text x="868" y="555" font-size="12">GND</text>
<text x="950" y="400" text-anchor="middle" font-weight="bold" font-size="13">WS2812B</text>
<text x="950" y="418" text-anchor="middle" font-size="12">131 LED</text>
<rect x="915" y="430" width="22" height="22" fill="#ffcc80" stroke="#f57f17"/>
<rect x="915" y="462" width="22" height="22" fill="#ffcc80" stroke="#f57f17"/>
<rect x="915" y="494" width="22" height="22" fill="#ffcc80" stroke="#f57f17"/>
<text x="926" y="535" text-anchor="middle" font-size="14">⋮</text>
<text x="927" y="585" text-anchor="middle" font-size="11" fill="#555">sens des flèches →</text>

<!-- Réinjection -->
<text x="860" y="625" font-size="11" fill="#c62828">fin du ruban : +5V et GND</text>
<text x="860" y="640" font-size="11" fill="#c62828">réinjectés depuis l'alim</text>

<!-- Calcul -->
<rect x="50" y="705" width="940" height="210" rx="8" fill="#ffffff" stroke="#bbb"/>
<text x="70" y="732" font-size="16" font-weight="bold">Calcul de l'alimentation (131 LED)</text>
<text x="70" y="758" font-size="13">I_alim = N × I_pixel × k_couleur × (luminosité / 100) × 1,2 (marge)   ;   P = U × I_alim</text>
<text x="70" y="784" font-size="13">• Pire cas, blanc 100 % (anciens WS2812B / clones, 60 mA) : 131 × 60 mA = 7,9 A → × 1,2 = <tspan font-weight="bold">9,4 A → alim 5 V 10 A (50 W)</tspan></text>
<text x="70" y="806" font-size="13">• WS2812B-V5 (3 × 16 mA = 48 mA) : 131 × 48 mA = 6,3 A → × 1,2 = <tspan font-weight="bold">7,5 A → alim 5 V 8 A (40 W)</tspan></text>
<text x="70" y="828" font-size="13">• Usage cuve (teinte pure, saturation max : 2 canaux au plus, k = 2/3) : 131 × 32 mA × 1,2 = 5,0 A</text>
<text x="70" y="850" font-size="13" fill="#555">   Tasmota ne limite pas le courant : un « Color FFFFFF » / « White » à 100 % reste possible → dimensionner pour le blanc.</text>
<text x="70" y="874" font-size="13">• Au repos (LED éteintes, ruban alimenté) : ≈ 1 mA par pixel → 0,13 A, 0,7 W en permanence.</text>
<text x="70" y="898" font-size="13">• Fil 5 V / GND : 1,5 mm² jusqu'à 10 A. Au-delà de ~1,5 m allumé en blanc, la fin du ruban jaunit : réinjecter.</text>

<!-- Panneau de droite -->
<rect x="1030" y="90" width="440" height="840" rx="10" fill="#fafafa" stroke="#bbb"/>
<text x="1050" y="122" font-size="17" font-weight="bold">Pourquoi ce montage</text>
<text x="1050" y="154" font-size="13" font-weight="bold">Le niveau du signal DIN</text>
<text x="1050" y="176" font-size="13">• WS2812B : « 1 » logique garanti à 0,7 × VDD</text>
<text x="1050" y="196" font-size="13">   = 3,5 V sous 5 V. Le GPIO de l'ESP32-S3 sort</text>
<text x="1050" y="216" font-size="13">   3,3 V : hors spécification. Ça marche souvent,</text>
<text x="1050" y="236" font-size="13">   jusqu'au jour où ça scintille (câble long, chaud,</text>
<text x="1050" y="256" font-size="13">   alim à 5,2 V…).</text>
<text x="1050" y="280" font-size="13">• 74AHCT125 alimenté en 5 V : son seuil d'entrée</text>
<text x="1050" y="300" font-size="13">   est TTL (≈ 2 V), il accepte le 3,3 V et sort 5 V</text>
<text x="1050" y="320" font-size="13">   franc, sans peine à 800 kHz.</text>
<text x="1050" y="344" font-size="13">• <tspan font-weight="bold">Pas de module BSS138 / 2N7000</tspan> (celui de</text>
<text x="1050" y="364" font-size="13">   l'I²C de l'ADS1115) : rappels de 10 kΩ, fronts</text>
<text x="1050" y="384" font-size="13">   trop lents pour 800 kHz.</text>
<text x="1050" y="408" font-size="13">• 330 Ω en série, côté ruban : amortit les</text>
<text x="1050" y="428" font-size="13">   rebonds sur le fil de données.</text>
<text x="1050" y="460" font-size="13" font-weight="bold">L'alimentation</text>
<text x="1050" y="482" font-size="13">• 1000 µF aux bornes du ruban : absorbe l'appel</text>
<text x="1050" y="502" font-size="13">   de courant à l'allumage (protège la 1re LED).</text>
<text x="1050" y="526" font-size="13">• Ordre : GND d'abord, puis +5 V, puis DIN.</text>
<text x="1050" y="546" font-size="13">   Jamais de DIN sous tension ruban coupé.</text>
<text x="1050" y="570" font-size="13">• Le +5 V du ruban ne passe <tspan font-weight="bold">jamais</tspan> par l'ESP32 :</text>
<text x="1050" y="590" font-size="13">   la carte prend son 5 V en dérivation du rail.</text>
<text x="1050" y="614" font-size="13">• Flashage par USB : débrancher le fil +5 V de la</text>
<text x="1050" y="634" font-size="13">   carte (garder le GND) si le dev-kit n'a pas de</text>
<text x="1050" y="654" font-size="13">   diode entre son 5 V USB et sa broche 5V.</text>
<text x="1050" y="686" font-size="13" font-weight="bold">Côté Tasmota</text>
<text x="1050" y="708" font-size="13">• GPIO6 = WS2812 (1376) dans le template ; le</text>
<text x="1050" y="728" font-size="13">   pilote TasmotaLED (RMT) émet au timing WS2812.</text>
<text x="1050" y="752" font-size="13">• Rien à changer dans le firmware pour ce ruban.</text>
<text x="1050" y="784" font-size="13" font-weight="bold">Composants (repères)</text>
<text x="1050" y="806" font-size="13">74AHCT125 (DIP-14 ou module), 330 Ω ¼ W,</text>
<text x="1050" y="826" font-size="13">1000 µF 10 V, 100 nF, fusible 10 A,</text>
<text x="1050" y="846" font-size="13">alim 5 V 10 A (50 W), fil 1,5 mm².</text>
<text x="1050" y="882" font-size="12" fill="#555">Note : outils_docs/Electronique/ADS1115/</text>
<text x="1050" y="900" font-size="12" fill="#555">CABLAGE_RUBAN_LED.md</text>
</svg>
