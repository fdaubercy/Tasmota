<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" font-family="Segoe UI, Arial, sans-serif" font-size="14">
<defs><g id="gnd" stroke="#222" stroke-width="2"><line x1="0" y1="0" x2="0" y2="12"/><line x1="-14" y1="12" x2="14" y2="12"/><line x1="-9" y1="18" x2="9" y2="18"/><line x1="-4" y1="24" x2="4" y2="24"/></g></defs>
<rect width="1500" height="960" fill="#ffffff"/>
<text x="30" y="42" font-size="24" font-weight="bold" fill="#111">Ruban WS2815 12 V — câblage sur l'ESP32-S3 de la cuve</text>
<text x="30" y="66" fill="#555">131 LED sur GPIO6 · ESP32 alimenté par un abaisseur 12 V → 5 V · données par 74AHCT125 (recommandé) · BI du 1er pixel à GND · GND commun</text>

<!-- Cadre du schéma -->
<rect x="30" y="90" width="980" height="840" rx="10" fill="#fafafa" stroke="#bbb"/>

<!-- Alimentation -->
<rect x="50" y="115" width="180" height="110" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="120" y="148" text-anchor="middle" font-weight="bold">Alimentation 12 V</text>
<text x="120" y="170" text-anchor="middle" font-size="13">3 A (36 W)</text>
<text x="222" y="155" text-anchor="end" font-size="12" fill="#c62828">+12V</text>
<text x="222" y="205" text-anchor="end" font-size="12">GND</text>

<!-- Rail +12V -->
<line x1="230" y1="150" x2="245" y2="150" stroke="#c62828" stroke-width="4"/>
<rect x="245" y="141" width="60" height="18" rx="3" fill="#fff" stroke="#c62828" stroke-width="2"/>
<text x="275" y="135" text-anchor="middle" font-size="12">fusible 4 A</text>
<line x1="305" y1="150" x2="840" y2="150" stroke="#c62828" stroke-width="4"/>
<line x1="840" y1="150" x2="840" y2="370" stroke="#c62828" stroke-width="4"/>
<line x1="840" y1="370" x2="860" y2="370" stroke="#c62828" stroke-width="4"/>
<text x="580" y="140" text-anchor="middle" fill="#c62828" font-size="13">+12 V puissance (0,75 mm² suffit pour 3 A)</text>

<!-- Retour GND puissance -->
<line x1="230" y1="200" x2="260" y2="200" stroke="#222" stroke-width="4"/>
<line x1="260" y1="200" x2="260" y2="660" stroke="#222" stroke-width="4"/>
<line x1="260" y1="660" x2="840" y2="660" stroke="#222" stroke-width="4"/>
<line x1="840" y1="660" x2="840" y2="580" stroke="#222" stroke-width="4"/>
<line x1="840" y1="580" x2="860" y2="580" stroke="#222" stroke-width="4"/>
<text x="550" y="680" text-anchor="middle" font-size="13">GND puissance — toutes les masses ⏚ (abaisseur, ESP32, 74AHCT125, BI) sont reliées à ce fil</text>

<!-- Condensateur réservoir -->
<line x1="780" y1="150" x2="780" y2="222" stroke="#c62828" stroke-width="2"/>
<line x1="764" y1="222" x2="796" y2="222" stroke="#222" stroke-width="3"/>
<line x1="764" y1="232" x2="796" y2="232" stroke="#222" stroke-width="3"/>
<line x1="780" y1="232" x2="780" y2="248" stroke="#222" stroke-width="2"/>
<use href="#gnd" x="780" y="248"/>
<text x="770" y="200" text-anchor="end" font-size="12">470–1000 µF</text>
<text x="770" y="215" text-anchor="end" font-size="12">≥ 25 V</text>
<text x="760" y="265" text-anchor="end" font-size="11" fill="#555">au plus près</text>
<text x="760" y="279" text-anchor="end" font-size="11" fill="#555">du ruban</text>

<!-- Abaisseur 12 V -> 5 V -->
<line x1="330" y1="150" x2="330" y2="190" stroke="#c62828" stroke-width="2"/>
<rect x="300" y="190" width="160" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="380" y="216" text-anchor="middle" font-weight="bold" font-size="13">Abaisseur 12 → 5 V</text>
<text x="380" y="234" text-anchor="middle" font-size="11" fill="#555">≥ 1 A (MP1584, LM2596…)</text>
<text x="310" y="252" font-size="11">IN+</text>
<text x="452" y="252" text-anchor="end" font-size="11">GND</text>
<line x1="440" y1="260" x2="440" y2="272" stroke="#222" stroke-width="2"/>
<use href="#gnd" x="440" y="272"/>
<text x="373" y="276" font-size="11" fill="#e65100">OUT 5V</text>
<line x1="360" y1="260" x2="360" y2="330" stroke="#e65100" stroke-width="2.5"/>
<line x1="360" y1="305" x2="610" y2="305" stroke="#e65100" stroke-width="2.5"/>
<circle cx="360" cy="305" r="3.5" fill="#e65100"/>
<line x1="610" y1="305" x2="610" y2="380" stroke="#e65100" stroke-width="2.5"/>
<text x="520" y="298" text-anchor="middle" font-size="12" fill="#e65100">+5 V logique</text>
<line x1="610" y1="340" x2="660" y2="340" stroke="#e65100" stroke-width="2"/>
<circle cx="610" cy="340" r="3.5" fill="#e65100"/>
<line x1="660" y1="340" x2="660" y2="350" stroke="#e65100" stroke-width="2"/>
<line x1="648" y1="350" x2="672" y2="350" stroke="#222" stroke-width="2.5"/>
<line x1="648" y1="358" x2="672" y2="358" stroke="#222" stroke-width="2.5"/>
<use href="#gnd" x="660" y="358"/>
<text x="680" y="358" font-size="11">100 nF</text>

<!-- ESP32-S3 -->
<rect x="300" y="330" width="170" height="230" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="385" y="420" text-anchor="middle" font-weight="bold">ESP32-S3</text>
<text x="385" y="440" text-anchor="middle" font-size="12" fill="#555">capteurs cuve</text>
<text x="360" y="350" text-anchor="middle" font-size="12">5V</text>
<text x="462" y="465" text-anchor="end">GPIO6</text>
<text x="360" y="552" text-anchor="middle" font-size="12">GND</text>
<line x1="360" y1="560" x2="360" y2="576" stroke="#222" stroke-width="2"/>
<use href="#gnd" x="360" y="576"/>
<text x="385" y="500" text-anchor="middle" font-size="11" fill="#555">sortie 3,3 V</text>

<!-- 74AHCT125 -->
<rect x="530" y="380" width="160" height="200" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
<text x="610" y="398" text-anchor="middle" font-size="12">VCC (14) = 5 V</text>
<text x="540" y="430" font-size="12">1OE (1) → GND</text>
<text x="540" y="465" font-size="12">1A (2)</text>
<text x="682" y="465" text-anchor="end" font-size="12">1Y (3)</text>
<text x="610" y="505" text-anchor="middle" font-weight="bold">74AHCT125</text>
<text x="610" y="521" text-anchor="middle" font-size="11" fill="#555">recommandé, facultatif</text>
<text x="610" y="535" text-anchor="middle" font-size="11" fill="#555">si liaison &lt; 30 cm</text>
<text x="537" y="553" font-size="9.5" fill="#555">2A–4A → GND · 2OE–4OE → 5 V</text>
<text x="610" y="572" text-anchor="middle" font-size="12">GND (7)</text>
<line x1="470" y1="460" x2="530" y2="460" stroke="#1565c0" stroke-width="2.5"/>
<line x1="610" y1="580" x2="610" y2="596" stroke="#222" stroke-width="2"/>
<use href="#gnd" x="610" y="596"/>

<!-- Résistance série -->
<line x1="690" y1="460" x2="730" y2="460" stroke="#6a1b9a" stroke-width="2.5"/>
<rect x="730" y="451" width="60" height="18" rx="2" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="760" y="444" text-anchor="middle" font-size="12">330 Ω</text>
<line x1="790" y1="460" x2="860" y2="460" stroke="#6a1b9a" stroke-width="2.5"/>
<text x="760" y="490" text-anchor="middle" font-size="11" fill="#555">signal 5 V</text>

<!-- BI du premier pixel -->
<line x1="860" y1="520" x2="800" y2="520" stroke="#222" stroke-width="2"/>
<line x1="800" y1="520" x2="800" y2="530" stroke="#222" stroke-width="2"/>
<use href="#gnd" x="800" y="530"/>
<text x="790" y="512" text-anchor="end" font-size="11">BI → GND</text>

<!-- Ruban -->
<rect x="860" y="330" width="135" height="290" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
<text x="868" y="375" font-size="12" fill="#c62828">+12V</text>
<text x="868" y="465" font-size="12" fill="#6a1b9a">DI</text>
<text x="868" y="525" font-size="12">BI</text>
<text x="868" y="585" font-size="12">GND</text>
<text x="950" y="400" text-anchor="middle" font-weight="bold" font-size="13">WS2815</text>
<text x="950" y="418" text-anchor="middle" font-size="12">131 LED</text>
<rect x="915" y="430" width="22" height="22" fill="#ffcc80" stroke="#f57f17"/>
<rect x="915" y="462" width="22" height="22" fill="#ffcc80" stroke="#f57f17"/>
<rect x="915" y="494" width="22" height="22" fill="#ffcc80" stroke="#f57f17"/>
<text x="926" y="535" text-anchor="middle" font-size="14">⋮</text>
<text x="927" y="607" text-anchor="middle" font-size="11" fill="#555">sens des flèches →</text>
<text x="860" y="640" font-size="11" fill="#2e7d32">une seule arrivée suffit</text>

<!-- Calcul -->
<rect x="50" y="705" width="940" height="210" rx="8" fill="#ffffff" stroke="#bbb"/>
<text x="70" y="732" font-size="16" font-weight="bold">Calcul de l'alimentation (131 LED)</text>
<text x="70" y="758" font-size="13" xml:space="preserve">I_alim = N × I_pixel × (luminosité / 100) × 1,2 (marge)   ;   P = U × I_alim</text>
<text x="70" y="784" font-size="13">• WS2815B : 0,18 W maxi par pixel (fiche) → I_pixel = 0,18 / 12 = 15 mA</text>
<text x="70" y="806" font-size="13">• 131 × 15 mA = 2,0 A → × 1,2 = <tspan font-weight="bold">2,4 A → alim 12 V 3 A (36 W)</tspan> ; puissance réelle ≈ 24 W en blanc</text>
<text x="70" y="828" font-size="13">• Les 3 puces d'un pixel sont alimentées en série sous 12 V : on garde k_couleur = 1 (dimensionnement sûr).</text>
<text x="70" y="850" font-size="13">• + abaisseur 5 V de l'ESP32 : ≈ 0,5 A sous 5 V → ≈ 0,25 A pris sur le 12 V. Total : 12 V 3 A reste suffisant.</text>
<text x="70" y="874" font-size="13">• Au repos (LED éteintes, ruban alimenté) : &lt; 2 mA par pixel (fiche) → jusqu'à 0,26 A, ≈ 3 W en permanence.</text>
<text x="70" y="898" font-size="13">• Fil 12 V / GND : 0,75 mm² pour 3 A. Chute de tension négligeable sur 5 m : pas de réinjection.</text>

<!-- Panneau de droite -->
<rect x="1030" y="90" width="440" height="840" rx="10" fill="#fafafa" stroke="#bbb"/>
<text x="1050" y="122" font-size="17" font-weight="bold">Pourquoi ce montage</text>
<text x="1050" y="154" font-size="13" font-weight="bold">Le niveau du signal DI</text>
<text x="1050" y="176" font-size="13">• Fiche WS2815B : VIH mini = 2,7 V (seuil fixe,</text>
<text x="1050" y="196" font-size="13">   régulateur interne), entrée maxi 5,7 V. Le</text>
<text x="1050" y="216" font-size="13">   3,3 V de l'ESP32 est <tspan font-weight="bold">dans la spécification</tspan>,</text>
<text x="1050" y="236" font-size="13">   mais avec 0,6 V de marge seulement.</text>
<text x="1050" y="260" font-size="13">• 74AHCT125 en 5 V : marge de 2,3 V, utile si</text>
<text x="1050" y="280" font-size="13">   le fil de données dépasse ~30 cm ou longe</text>
<text x="1050" y="300" font-size="13">   des câbles de puissance (relais, pompe).</text>
<text x="1050" y="324" font-size="13">• Jamais de 12 V sur DI/BI : 5,7 V au maximum.</text>
<text x="1050" y="356" font-size="13" font-weight="bold">Les deux lignes de données</text>
<text x="1050" y="378" font-size="13">• Ruban à 4 fils : +12V, DI, BI, GND. BI est la</text>
<text x="1050" y="398" font-size="13">   ligne de secours : un pixel mort est sauté.</text>
<text x="1050" y="418" font-size="13">• Au 1er pixel, BI n'a pas de pixel amont : le</text>
<text x="1050" y="438" font-size="13">   relier à GND (sinon scintillements possibles).</text>
<text x="1050" y="470" font-size="13" font-weight="bold">L'alimentation</text>
<text x="1050" y="492" font-size="13">• Le 12 V ne touche <tspan font-weight="bold">jamais</tspan> l'ESP32 : abaisseur à</text>
<text x="1050" y="512" font-size="13">   découpage (pas de 7805 : 3,5 W perdus en chaleur).</text>
<text x="1050" y="536" font-size="13">• Régler l'abaisseur à 5,0 V AVANT de brancher</text>
<text x="1050" y="556" font-size="13">   la carte (modules réglables livrés au hasard).</text>
<text x="1050" y="580" font-size="13">• Ordre : GND, puis +12 V, puis données.</text>
<text x="1050" y="612" font-size="13" font-weight="bold">Côté Tasmota — point à surveiller</text>
<text x="1050" y="634" font-size="13">• WS2815 : RESET &gt; 280 µs. TasmotaLED (timing</text>
<text x="1050" y="654" font-size="13">   WS2812) émet 80 µs (TasmotaLED.cpp:46).</text>
<text x="1050" y="674" font-size="13">• Sans effet tant que deux trames ne se suivent</text>
<text x="1050" y="694" font-size="13">   pas à moins de 280 µs (cas normal : ≥ 50 ms).</text>
<text x="1050" y="714" font-size="13">   Symptôme sinon : une trame décalée, rare.</text>
<text x="1050" y="734" font-size="13">• Ordre des couleurs : GRB, comme le WS2812B.</text>
<text x="1050" y="766" font-size="13" font-weight="bold">Composants (repères)</text>
<text x="1050" y="788" font-size="13">Alim 12 V 3 A, fusible 4 A, abaisseur 12→5 V</text>
<text x="1050" y="808" font-size="13">≥ 1 A, 74AHCT125, 330 Ω ¼ W, 470–1000 µF</text>
<text x="1050" y="828" font-size="13">25 V, 100 nF, fil 0,75 mm².</text>
<text x="1050" y="882" font-size="12" fill="#555">Note : outils_docs/Electronique/ADS1115/</text>
<text x="1050" y="900" font-size="12" fill="#555">CABLAGE_RUBAN_LED.md</text>
</svg>
