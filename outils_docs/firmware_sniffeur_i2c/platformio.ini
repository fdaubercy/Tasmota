; Firmware du sniffeur I2C (ESP32-S3 DevKit dedie, PAS une carte Tasmota du parc).
; Projet PlatformIO autonome : rien de commun avec platformio_tasmota_cenv.ini ni les pre-scripts Tasmota.
;   compiler   : pio run -d outils_docs/firmware_sniffeur_i2c          (jamais pendant un build Tasmota)
;   televerser : pio run -d outils_docs/firmware_sniffeur_i2c -t upload --upload-port COMn
; Branchement au PC : port USB NATIF du DevKit (marque « USB »), pas le port « UART ».
; Conception : docs/superpowers/specs/2026-10-31-sniffeur-i2c-design.md (protocole serie : §5).

[platformio]
default_envs = esp32s3

[env:esp32s3]
; meme plateforme et meme framework que le depot Tasmota : deja installes, rien a telecharger
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.10.50/platform-espressif32.zip
platform_packages = framework-arduinoespressif32 @ https://github.com/tasmota/arduino-esp32/releases/download/v3.3.12/framework-arduinoespressif32.tar.xz
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBROCHE_SDA=4
    -DBROCHE_SCL=5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
