<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Envs par défaut : maquettes</title>
<style>
  /* Variables et composants recopies de build_page.py pour un rendu fidele ; rien n'est ecrit par cette page. */
  :root{color-scheme:light;--fond:#f6f7f9;--carte:#fff;--bord:#ddd;--texte:#222;--doux:#666;--discret:#777;--bleu:#2563eb;--vert:#2a9d4a;--orange:#c27400;--rouge:#c0392b;
    --btn:#fff;--btn-bord:#888;--survol:#f0f3f8;--rouge-fond:#fdecea;--orange-fond:#fff4e0;--bleu-fond:#eef3ff;--vert-fond:#e8f6ec}
  *{box-sizing:border-box}
  body{margin:0;font:14px system-ui,sans-serif;color:var(--texte);background:var(--fond)}
  main{max-width:1200px;margin:0 auto;padding:12px 16px 24px}
  h1{font-size:20px;margin:6px 0 10px}
  h2{font-size:15px;margin:0 0 8px}
  .bandeau-maquette{background:#1f2937;color:#fff;padding:7px 16px;font-size:13px;font-weight:600}
  .onglets{display:flex;gap:4px;border-bottom:1px solid var(--bord);margin-bottom:12px}
  .onglets span{padding:7px 14px;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;color:var(--doux)}
  .onglets span.actif{background:var(--carte);border-color:var(--bord);color:var(--texte);font-weight:600;margin-bottom:-1px}
  .carte{background:var(--carte);border:1px solid var(--bord);border-radius:8px;padding:10px 12px}
  .disposition{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
  .pile{display:flex;flex-direction:column;gap:8px}
  .discret{color:var(--discret);font-size:12px}
  .btn{display:inline-block;padding:6px 12px;border-radius:6px;border:1px solid var(--btn-bord);background:var(--btn);color:var(--texte);font:inherit;font-size:13px;cursor:pointer;text-align:center}
  .btn.p{background:var(--bleu);color:#fff;border-color:var(--bleu);font-weight:600}
  .avert{font-size:12px;color:var(--doux);border-left:3px solid var(--orange);padding:2px 0 2px 8px}
  .gros{font-size:26px;font-weight:700;color:var(--bleu)}
  .nom{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;overflow-wrap:anywhere}
  .env{display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--bord);cursor:pointer}
  .env input{width:16px;height:16px;margin:0;flex:none}
  .env.coche{background:var(--bleu-fond)}
  .absent{font-size:11px;color:var(--orange);border:1px solid var(--orange);border-radius:10px;padding:0 7px;white-space:nowrap;margin-left:auto}
  .groupe{background:var(--carte);border:1px solid var(--bord);border-radius:8px;margin-bottom:10px;overflow:hidden}
  .groupe > .titre{padding:9px 12px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
  .compte{font-weight:400;color:var(--discret);font-size:12px}
  .colonnes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start;margin-bottom:12px}
  .colonnes .env{align-items:flex-start;padding:7px 9px;gap:7px}
  .colonnes .nom{font-size:11.5px}
  .colonnes .absent{margin-left:0;display:inline-block;margin-top:3px}
  .barre-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .barre-actions .avert{flex:1 1 300px}
  .transfert{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);gap:10px;align-items:start;margin-bottom:12px}
  .transfert .milieu{display:flex;flex-direction:column;gap:8px;padding-top:70px}
  .ligne-liste{display:flex;align-items:center;gap:8px;padding:5px 12px;border-top:1px solid var(--bord)}
  .ligne-liste.choisie{background:var(--bleu-fond);box-shadow:inset 3px 0 0 var(--bleu)}
  .sous-titre{padding:5px 12px;font-size:11.5px;color:var(--discret);border-top:1px solid var(--bord);background:var(--fond)}
  .editeur{font:12.5px/1.6 ui-monospace,Consolas,monospace;background:var(--carte);border:1px solid var(--bord);border-radius:8px;padding:6px 0;overflow:hidden}
  .fl{display:flex;align-items:center;gap:8px;padding:0 10px;white-space:pre;min-height:21px}
  .fl input{width:14px;height:14px;margin:0;flex:none}
  .fl .espace{display:inline-block;width:14px;flex:none}
  .fl.com{color:var(--discret)}
  .fl.off{color:var(--doux)}
  .fl.on{background:var(--bleu-fond);font-weight:600}
  .fl.ajout{background:var(--orange-fond)}
  .diff{font:12px/1.6 ui-monospace,Consolas,monospace;background:var(--carte);border:1px solid var(--bord);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
  .diff .plus{color:var(--vert);background:var(--vert-fond);display:block}
  .diff .moins{color:var(--rouge);background:var(--rouge-fond);display:block}
  .diff .ctx{color:var(--discret);display:block}
</style>
</head>
<body>
<div class="bandeau-maquette" id="bandeau"></div>
<main>
  <h1>Build et téléversement</h1>
  <div class="onglets"><span>Build</span><span>Fichiers</span><span>Mémoire et partitions</span><span class="actif">Envs par défaut</span></div>
  <div id="vue"></div>
</main>
<script>
"use strict";
// Etat reel du bloc default_envs au 2026-11-01. a = active ; absent = pas de ligne dans le bloc (carte ou base du cenv).
var GROUPES = [
  ["Safeboot", [["tasmota32-safeboot"], ["tasmota32s3-safeboot"], ["tasmota32p4-safeboot"], ["tasmota32p4r3-safeboot"]]],
  ["ESP32", [["tasmota32-base"], ["tasmota32-cave-serveur-rly"], ["tasmota32-rdc-vr-porte"], ["tasmota32-bureau-interrupteur-differentiel"]]],
  ["ESP32-S3", [["tasmota32s3-base-N16R8"], ["tasmota32s3-garage-serveur-modbus"], ["tasmota32s3-garage-capteurs-cuve-modbus", 1],
                ["tasmota32s3-garage-rideau-garage-modbus", 1], ["tasmota32s3-etage2-grenier"], ["tasmota32s3-cave-serveur-rly", 1],
                ["tasmota32s3-base-N16R8-sans-ecran", 0, 1]]],
  ["ESP32-P4", [["tasmota32p4-base-wifi6"], ["tasmota32p4-base-devkit"], ["tasmota32p4-garage-serveur-modbus", 1], ["tasmota32p4r3-base-devkit", 0, 1]]]
];
var PURGE = "Le prochain <code>pio run</code> videra <code>.pio/build</code> : les objets inchangés reviennent du cache <code>.cache</code>.";
var TITRES = {A: "Modèle A : cases par groupe de puce, résumé à droite", B: "Modèle B : une colonne par puce, tout visible d'un coup",
              C: "Modèle C : deux listes, « Compilés » et « Non compilés »", D: "Modèle D : le bloc du fichier à gauche, le diff à droite"};
var modele = (location.search.match(/m=([A-D])/) || [0, "A"])[1];

function caseEnv(e) {
  return '<label class="env' + (e[1] ? " coche" : "") + '"><input type="checkbox"' + (e[1] ? " checked" : "") + '>' +
         '<span><span class="nom">' + e[0] + '</span>' + (e[2] ? ' <span class="absent">absent du bloc</span>' : "") + '</span></label>';
}
function nombre(g) { return g[1].filter(function (e) { return e[1]; }).length; }
var total = GROUPES.reduce(function (n, g) { return n + nombre(g); }, 0);

function boutons() {
  return '<button class="btn p" type="button">Voir le diff et enregistrer</button>' +
         '<button class="btn" type="button">Cocher ces envs dans l\'onglet Build</button>';
}
function modeleA() {
  var liste = GROUPES.map(function (g) {
    return '<div class="groupe"><div class="titre">' + g[0] + ' <span class="compte">' + nombre(g) + " / " + g[1].length + '</span></div>' +
           g[1].map(caseEnv).join("") + '</div>';
  }).join("");
  return '<div class="disposition"><section>' + liste + '</section><aside class="carte pile"><h2>Un <code>pio run</code> compilera</h2>' +
         '<div><span class="gros">' + total + '</span> envs</div>' + boutons() + '<div class="avert">' + PURGE + '</div></aside></div>';
}
function modeleB() {
  var cols = GROUPES.map(function (g) {
    return '<div class="groupe" style="margin:0"><div class="titre">' + g[0] + ' <span class="compte">' + nombre(g) + " / " + g[1].length + '</span></div>' +
           g[1].map(caseEnv).join("") + '</div>';
  }).join("");
  return '<div class="colonnes">' + cols + '</div><div class="carte barre-actions"><span><b class="gros">' + total + '</b> envs compilés par <code>pio run</code></span>' +
         boutons() + '<div class="avert">' + PURGE + '</div></div>';
}
function lignesListe(actifs, choisi) {
  return GROUPES.map(function (g) {
    var es = g[1].filter(function (e) { return !!e[1] === actifs; });
    if (!es.length) return "";
    return '<div class="sous-titre">' + g[0] + '</div>' + es.map(function (e) {
      return '<div class="ligne-liste' + (e[0] === choisi ? " choisie" : "") + '"><span class="nom">' + e[0] + '</span>' +
             (e[2] ? '<span class="absent">absent du bloc</span>' : "") + '</div>';
    }).join("");
  }).join("");
}
function modeleC() {
  return '<div class="transfert"><div class="groupe" style="margin:0"><div class="titre">Non compilés <span class="compte">' + (19 - total) + ' envs</span></div>' +
         lignesListe(false, "tasmota32-rdc-vr-porte") + '</div>' +
         '<div class="milieu"><button class="btn p" type="button">Ajouter →</button><button class="btn" type="button">← Retirer</button></div>' +
         '<div class="groupe" style="margin:0"><div class="titre"><span>Compilés par <code>pio run</code></span> <span class="compte">' + total + ' envs</span></div>' +
         lignesListe(true) + '</div></div><div class="carte barre-actions">' + boutons() + '<div class="avert">' + PURGE + '</div></div>';
}
function ligneFichier(e) {
  var classe = e[2] ? "ajout" : (e[1] ? "on" : "off");
  var texte = (e[1] ? "" : "; ") + e[0] + (e[2] ? "      ; à ajouter si coché" : "");
  return '<div class="fl ' + classe + '"><input type="checkbox"' + (e[1] ? " checked" : "") + '>' + texte + '</div>';
}
function modeleD() {
  // Les cases refletent le diff d'exemple : rideau decoche, volet de la porte coche.
  GROUPES[2][1][3][1] = 0; GROUPES[1][1][2][1] = 1;
  var noms = {"Safeboot": "Versions Safeboot", "ESP32": "Versions de Tasmota pour ESP32", "ESP32-S3": "Versions de Tasmota pour ESP32S3", "ESP32-P4": "Versions de Tasmota pour ESP32P4"};
  var bloc = '<div class="fl com"><span class="espace"></span>default_envs =</div>' + GROUPES.map(function (g) {
    return '<div class="fl com"><span class="espace"></span>; *** ' + noms[g[0]] + '</div>' + g[1].map(ligneFichier).join("");
  }).join("");
  var diff = '<span class="ctx">@@ platformio_override.ini @@</span>' +
             '<span class="moins">-    tasmota32s3-garage-rideau-garage-modbus</span>' +
             '<span class="plus">+    ; tasmota32s3-garage-rideau-garage-modbus</span>' +
             '<span class="moins">-    ; tasmota32-rdc-vr-porte</span>' +
             '<span class="plus">+    tasmota32-rdc-vr-porte</span>';
  return '<div class="disposition" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)"><section class="editeur">' + bloc + '</section>' +
         '<aside class="pile"><div class="carte pile"><h2>Modifications en attente (exemple)</h2><div class="diff">' + diff + '</div>' +
         '<button class="btn p" type="button">Enregistrer</button><button class="btn" type="button">Cocher ces envs dans l\'onglet Build</button>' +
         '<div class="avert">' + PURGE + '</div></div></aside></div>';
}
document.getElementById("bandeau").textContent = TITRES[modele] + " (maquette, rien n'est écrit)";
document.getElementById("vue").innerHTML = {A: modeleA, B: modeleB, C: modeleC, D: modeleD}[modele]();
</script>
</body>
</html>
